<h1>Directorio ({{ totalUsers() }} usuario(s))</h1>
<app-controls (orderByIdClick)="orderById()" (orderByNameClick)="orderByName()" (reverse)="reverse()"></app-controls>

<div class="container">


  @for (user of users(); track $index) {
    <app-user-card [user]="user" (deleteUser)="removeUser($event)"></app-user-card>
  } @empty {
    <p class="empty-msg">No hay usuarios en el Directorio</p>
  }

  
</div>
