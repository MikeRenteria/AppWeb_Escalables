<article class="user-card">
    <div class="card-header">
        <img class="avatar" [src]="user().image" [alt]="'Avatar de ' + user().name">
    </div>

    <div class="card-body">
        <span class="user-badge">{{ user().id }}</span>
        <h2 class="user-name">{{ user().name }}</h2>
        <p class="user-username">&#64;{{ user().username }}</p>
        <p class="user-email">{{ user().email }}</p>
        <!-- Boton de eliminar carta para cada una con la llamada on clic de eliminar la carta -->
        <button class="delete-user" (click)="onDelete()">Eliminar</button>

    </div>
</article>
